controller:
  type: daemonset
  hostNetwork: true
  hostPID: true
  dnsPolicy: ClusterFirstWithHostNet

  volumes:
    extra:
      - name: host-proc
        hostPath:
          path: /proc
          type: Directory

      - name: host-sys
        hostPath:
          path: /sys
          type: Directory

      - name: host-root
        hostPath:
          path: /
          type: Directory

alloy:
  configMap:
    create: true
    content: |
      prometheus.exporter.unix "node" {
        procfs_path = "/host/proc"
        sysfs_path  = "/host/sys"
        rootfs_path = "/host/root"
      }

  clustering:
    enabled: false

  mounts:
    extra:
      - name: host-proc
        mountPath: /host/proc
        readOnly: true

      - name: host-sys
        mountPath: /host/sys
        readOnly: true

      - name: host-root
        mountPath: /host/root
        readOnly: true